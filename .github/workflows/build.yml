name: Build ZachTune Pro VST3 (macOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal macOS build
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build VST3
        run: cmake --build build --config Release --parallel 3
      - name: Package VST3
        run: |
          mkdir -p dist
          ditto "build/ZachTune_artefacts/Release/VST3/ZachTune.vst3" "dist/ZachTune.vst3"
      - name: Upload macOS VST3
        uses: actions/upload-artifact@v4
        with:
          name: ZachTune-Pro-macOS-Universal-VST3
          path: dist/ZachTune.vst3
          if-no-files-found: error
